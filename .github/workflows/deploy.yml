name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/collab-notes-api:latest
            ${{ env.IMAGE_PREFIX }}/collab-notes-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Collab
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/collab/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/collab-notes-collab:latest
            ${{ env.IMAGE_PREFIX }}/collab-notes-collab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/collab-notes-web:latest
            ${{ env.IMAGE_PREFIX }}/collab-notes-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Uncomment to deploy to Kubernetes with Helm
